<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Copilot</title>

    <style>

        body {

            font-family: Arial, sans-serif;
            background: #16213e;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {

            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        h1 {

            text-align: center;
            margin-bottom: 30px;
        }

        .card {

            background: #1f4068;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        button {

            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 10px;
        }

        .upload-btn {

            background: #4e73df;
            color: white;
        }

        .ask-btn {

            background: #4e73df;
            color: white;
        }

        .clear-btn {

            background: #e74a3b;
            color: white;
        }

        textarea {

            width: 100%;
            height: 120px;
            border-radius: 12px;
            border: none;
            padding: 15px;
            font-size: 18px;
            background: #0f3460;
            color: white;
            resize: vertical;
            box-sizing: border-box;
        }

        select {

            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            margin-bottom: 15px;
            background: #0f3460;
            color: white;
            font-size: 16px;
        }

        .stats {

            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {

            flex: 1;
            background: #2c4aa5;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-box h2 {

            font-size: 50px;
            margin: 0;
        }

        .message {

            background: #2c4aa5;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .bot {

            background: #001f5b;
        }

        .citation {

            background: #0f3460;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .status {

            margin-top: 10px;
            color: #8fff9f;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Study Copilot</h1>

        <!-- Upload -->

        <div class="card">

            <input type="file" id="pdfFile" accept=".pdf">

            <button class="upload-btn" onclick="uploadPDF()">
                Upload PDF
            </button>

            <div id="uploadStatus" class="status"></div>

        </div>

        <!-- Ask -->

        <div class="card">

            <select id="documentSelect">

                <option>
                    All Documents
                </option>

            </select>

            <textarea
                id="question"
                placeholder="Ask anything from your PDFs..."
            ></textarea>

            <button class="ask-btn" onclick="askQuestion()">
                Ask AI
            </button>

            <button class="clear-btn" onclick="clearKnowledgeBase()">
                Clear Knowledge Base
            </button>

        </div>

        <!-- Stats -->

        <div class="card">

            <h2>Indexed Documents</h2>

            <div class="stats">

                <div class="stat-box">

                    <h2 id="docCount">0</h2>

                    <p>Documents</p>

                </div>

                <div class="stat-box">

                    <h2 id="chunkCount">0</h2>

                    <p>Chunks</p>

                </div>

            </div>

            <div id="documentList"></div>

        </div>

        <!-- Chat -->

        <div id="chatContainer"></div>

    </div>

    <script>

        async function loadDocuments() {

            const response = await fetch("/documents");

            const data = await response.json();

            document.getElementById(
                "docCount"
            ).innerText = data.total_documents;

            document.getElementById(
                "chunkCount"
            ).innerText = data.total_chunks;

            const documentList = document.getElementById(
                "documentList"
            );

            documentList.innerHTML = "";

            const select = document.getElementById(
                "documentSelect"
            );

            select.innerHTML = `
<option>All Documents</option>
`;

            data.documents.forEach(doc => {

                documentList.innerHTML += `
<div class="message">
    <h3>${doc.name}</h3>
    <p>${doc.chunks} chunks indexed</p>
</div>
`;

                select.innerHTML += `
<option>${doc.name}</option>
`;
            });
        }

        async function uploadPDF() {

            const fileInput = document.getElementById(
                "pdfFile"
            );

            const file = fileInput.files[0];

            if (!file) {

                alert("Please select a PDF.");

                return;
            }

            const formData = new FormData();

            formData.append("pdf", file);

            document.getElementById(
                "uploadStatus"
            ).innerText = "Uploading and indexing PDF...";

            const response = await fetch("/upload", {

                method: "POST",

                body: formData
            });

            const data = await response.json();

            document.getElementById(
                "uploadStatus"
            ).innerText = data.message || data.error;

            loadDocuments();
        }

        async function askQuestion() {

            const question = document.getElementById(
                "question"
            ).value;

            if (!question.trim()) {

                alert("Please enter a question.");

                return;
            }

            const selectedDoc = document.getElementById(
                "documentSelect"
            ).value;

            const chatContainer = document.getElementById(
                "chatContainer"
            );

            chatContainer.innerHTML += `
<div class="message">
    <h3>You</h3>
    <p>Source: ${selectedDoc}</p>
    <p>${question}</p>
</div>

<div class="message bot">
    <h3>AI Answer</h3>
    <p>Thinking...</p>
</div>
`;

            const response = await fetch("/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    question: question,

                    selected_doc: selectedDoc,

                    history: []
                })
            });

            const data = await response.json();

            chatContainer.innerHTML += `
<div class="message bot">
    <h3>AI Answer</h3>
    <p>${data.answer}</p>

    <h3>Citations</h3>

    ${
        data.citations.map(citation => `
        <div class="citation">
            <p><strong>Source:</strong> ${citation.source}</p>
            <p><strong>Page:</strong> ${citation.page}</p>
            <p><strong>Score:</strong> ${citation.hybrid_score}</p>
            <p>${citation.preview}</p>
        </div>
        `).join("")
    }
</div>
`;

            document.getElementById(
                "question"
            ).value = "";
        }

        async function clearKnowledgeBase() {

            if (!confirm(
                "Are you sure?"
            )) {

                return;
            }

            await fetch("/clear", {

                method: "POST"
            });

            document.getElementById(
                "chatContainer"
            ).innerHTML = "";

            loadDocuments();
        }

        loadDocuments();

    </script>

</body>

</html>
