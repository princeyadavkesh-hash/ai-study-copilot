<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Study Copilot</title>

    <!-- MARKDOWN RENDERER -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        body {
            background-color: #07153a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 75%;
            margin: auto;
            margin-top: 40px;
            background: #1e2b4a;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
        }

        h1 {
            text-align: center;
            font-size: 60px;
            margin-bottom: 40px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #02103a;
            color: white;
            border: 1px solid #3d5ba9;
            border-radius: 15px;
            padding: 20px;
            font-size: 20px;
            box-sizing: border-box;
            margin-top: 20px;
            resize: vertical;
        }

        select {
            width: 100%;
            padding: 18px;
            background: #02103a;
            color: white;
            border: 1px solid #3d5ba9;
            border-radius: 15px;
            font-size: 18px;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            background: #3d6df2;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #5a84ff;
        }

        .danger-button {
            background: #d94141;
        }

        .danger-button:hover {
            background: #ff5c5c;
        }

        .status {
            margin-top: 20px;
            font-size: 18px;
            color: #7CFF9B;
            white-space: pre-line;
        }

        .loading {
            margin-top: 20px;
            color: #ffd166;
            font-size: 18px;
        }

        .chat-container {
            margin-top: 40px;
        }

        .message {
            margin-top: 25px;
            padding: 25px;
            border-radius: 20px;
            line-height: 1.8;
            font-size: 18px;
        }

        .user-message {
            background: #244cb3;
        }

        .ai-message {
            background: #071a4d;
        }

        .citation-box {
            margin-top: 15px;
            background: #10255f;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #4d7cff;
        }

        .message-title {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .preview {
            margin-top: 10px;
            color: #c7d7ff;
            font-size: 15px;
        }

        .typing-cursor {
            display: inline-block;
            width: 10px;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            50% {
                opacity: 0;
            }
        }

        .stats-container {
            margin-top: 40px;
            background: #162d73;
            padding: 30px;
            border-radius: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: #244194;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 50px;
            font-weight: bold;
        }

        .stat-label {
            margin-top: 10px;
            font-size: 22px;
        }

        .doc-card {
            background: #244194;
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .doc-name {
            font-size: 24px;
            font-weight: bold;
        }

        .doc-meta {
            margin-top: 8px;
            color: #d6e2ff;
            font-size: 18px;
        }

        /* MARKDOWN STYLING */

        .ai-message h1,
        .ai-message h2,
        .ai-message h3 {
            margin-top: 25px;
            color: #9cc2ff;
        }

        .ai-message ul {
            padding-left: 25px;
        }

        .ai-message li {
            margin-top: 10px;
        }

        .ai-message code {
            background: #02103a;
            padding: 3px 8px;
            border-radius: 6px;
            color: #ffd166;
        }

        .ai-message pre {
            background: #02103a;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Study Copilot</h1>

        <input
            type="file"
            id="pdfFile"
        >

        <button onclick="uploadPDF()">
            Upload PDF
        </button>

        <select id="documentSelector">

            <option>
                All Documents
            </option>

        </select>

        <textarea
            id="question"
            placeholder="Ask anything from your PDFs..."
        ></textarea>

        <button onclick="askQuestion()">
            Ask AI
        </button>

        <button
            class="danger-button"
            onclick="clearKnowledgeBase()"
        >
            Clear Knowledge Base
        </button>

        <div
            id="status"
            class="status"
        ></div>

        <div
            id="loading"
            class="loading"
        ></div>

        <!-- DOCUMENT STATS -->

        <div class="stats-container">

            <h2>Indexed Documents</h2>

            <div class="stats-grid">

                <div class="stat-card">

                    <div
                        id="totalDocuments"
                        class="stat-number"
                    >
                        0
                    </div>

                    <div class="stat-label">
                        Documents
                    </div>

                </div>

                <div class="stat-card">

                    <div
                        id="totalChunks"
                        class="stat-number"
                    >
                        0
                    </div>

                    <div class="stat-label">
                        Chunks
                    </div>

                </div>

            </div>

            <div id="documentsList"></div>

        </div>

        <!-- CHAT -->

        <div
            id="chatContainer"
            class="chat-container"
        ></div>

    </div>

    <script>

        let chatHistory = [];

        // =========================================
        // LOAD DOCUMENTS
        // =========================================

        async function loadDocuments() {

            const response =
                await fetch("/documents");

            const data =
                await response.json();

            const documentsList =
                document.getElementById(
                    "documentsList"
                );

            const selector =
                document.getElementById(
                    "documentSelector"
                );

            document.getElementById(
                "totalDocuments"
            ).innerText =
                data.total_documents;

            document.getElementById(
                "totalChunks"
            ).innerText =
                data.total_chunks;

            documentsList.innerHTML = "";

            selector.innerHTML = `
                <option>
                    All Documents
                </option>
            `;

            data.documents.forEach(doc => {

                documentsList.innerHTML += `
                    <div class="doc-card">

                        <div class="doc-name">
                            ${doc.name}
                        </div>

                        <div class="doc-meta">
                            ${doc.chunks} chunks indexed
                        </div>

                    </div>
                `;

                selector.innerHTML += `
                    <option>
                        ${doc.name}
                    </option>
                `;
            });
        }

        // =========================================
        // UPLOAD PDF
        // =========================================

        async function uploadPDF() {

            const fileInput =
                document.getElementById(
                    "pdfFile"
                );

            const file =
                fileInput.files[0];

            const statusDiv =
                document.getElementById(
                    "status"
                );

            if (!file) {

                alert("Please select a PDF.");

                return;
            }

            const formData =
                new FormData();

            formData.append(
                "pdf",
                file
            );

            statusDiv.innerText =
                "Uploading and indexing PDF...";

            const response =
                await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

            const data =
                await response.json();

            statusDiv.innerText =
                data.message || data.error;

            loadDocuments();
        }

        // =========================================
        // CLEAR KNOWLEDGE BASE
        // =========================================

        async function clearKnowledgeBase() {

            const confirmed =
                confirm(
                    "Clear all indexed PDFs?"
                );

            if (!confirmed) {
                return;
            }

            const response =
                await fetch("/reset", {
                    method: "POST"
                });

            const data =
                await response.json();

            document.getElementById(
                "status"
            ).innerText =
                data.message;

            document.getElementById(
                "chatContainer"
            ).innerHTML = "";

            chatHistory = [];

            loadDocuments();
        }

        // =========================================
        // ASK QUESTION
        // =========================================

        async function askQuestion() {

            const questionInput =
                document.getElementById(
                    "question"
                );

            const question =
                questionInput.value.trim();

            const loadingDiv =
                document.getElementById(
                    "loading"
                );

            const chatContainer =
                document.getElementById(
                    "chatContainer"
                );

            const selectedDocument =
                document.getElementById(
                    "documentSelector"
                ).value;

            if (!question) {

                alert(
                    "Please enter a question."
                );

                return;
            }

            loadingDiv.innerText =
                "Thinking...";

            // USER MESSAGE

            chatContainer.innerHTML += `
                <div class="message user-message">

                    <div class="message-title">
                        You
                    </div>

                    <div style="opacity:0.7; margin-bottom:15px;">

                        Source:
                        ${selectedDocument}

                    </div>

                    ${question}

                </div>
            `;

            // STREAMING REQUEST

            const response =
                await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        question: question,
                        history: chatHistory,
                        selected_document:
                            selectedDocument
                    })
                });

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            // CREATE AI MESSAGE BOX

            const aiMessageId =
                "ai-" + Date.now();

            const citationsId =
                "citations-" + Date.now();

            chatContainer.innerHTML += `
                <div class="message ai-message">

                    <div class="message-title">
                        AI Answer
                    </div>

                    <div id="${aiMessageId}"></div>

                    <br>

                    <div class="message-title">
                        Citations
                    </div>

                    <div id="${citationsId}"></div>

                </div>
            `;

            const aiDiv =
                document.getElementById(
                    aiMessageId
                );

            const citationsDiv =
                document.getElementById(
                    citationsId
                );

            let finalAnswer = "";

            while (true) {

                const {
                    value,
                    done
                } = await reader.read();

                if (done) {
                    break;
                }

                const chunk =
                    decoder.decode(value);

                const lines =
                    chunk.split("\n");

                for (const line of lines) {

                    if (
                        line.startsWith(
                            "data: "
                        )
                    ) {

                        try {

                            const jsonData =
                                JSON.parse(
                                    line.replace(
                                        "data: ",
                                        ""
                                    )
                                );

                            // TOKEN STREAM

                            if (
                                jsonData.token
                            ) {

                                finalAnswer +=
                                    jsonData.token;

                                aiDiv.innerHTML =
                                    marked.parse(finalAnswer) +
                                    '<span class="typing-cursor">|</span>';

                                window.scrollTo({
                                    top:
                                        document.body.scrollHeight,
                                    behavior:
                                        "smooth"
                                });
                            }

                            // DONE

                            if (
                                jsonData.done
                            ) {

                                aiDiv.innerHTML =
                                    marked.parse(finalAnswer);

                                let citationsHTML =
                                    "";

                                jsonData.citations.forEach(
                                    citation => {

                                        citationsHTML += `
                                            <div class="citation-box">

                                                <p>
                                                    <strong>
                                                        Source:
                                                    </strong>

                                                    ${citation.source}
                                                </p>

                                                <p>
                                                    <strong>
                                                        Page:
                                                    </strong>

                                                    ${citation.page}
                                                </p>

                                                <p>
                                                    <strong>
                                                        Hybrid Score:
                                                    </strong>

                                                    ${citation.hybrid_score}
                                                </p>

                                                <div class="preview">

                                                    ${citation.preview}

                                                    <br><br>

                                                    <button
                                                        onclick="togglePreview('preview-${citation.rank}')"
                                                        style="
                                                            width:auto;
                                                            padding:8px 14px;
                                                            font-size:14px;
                                                            background:#355edb;
                                                        "
                                                    >
                                                        Expand
                                                    </button>

                                                    <div
                                                        id="preview-${citation.rank}"
                                                        style="
                                                            display:none;
                                                            margin-top:12px;
                                                            color:#d6e2ff;
                                                            line-height:1.7;
                                                        "
                                                    >
                                                        ${citation.preview}
                                                    </div>

                                                </div>

                                            </div>
                                        `;
                                    }
                                );

                                citationsDiv.innerHTML =
                                    citationsHTML;

                                loadingDiv.innerText =
                                    "";

                                chatHistory.push({
                                    role: "user",
                                    content: question
                                });

                                chatHistory.push({
                                    role: "assistant",
                                    content: finalAnswer
                                });
                            }

                        } catch (e) {

                            console.log(e);
                        }
                    }
                }
            }

            questionInput.value = "";
        }

        // =========================================
        // TOGGLE PREVIEW
        // =========================================

        function togglePreview(id) {

            const element =
                document.getElementById(id);

            if (
                element.style.display ===
                "none"
            ) {

                element.style.display =
                    "block";

            } else {

                element.style.display =
                    "none";
            }
        }

        // =========================================
        // ENTER SUPPORT
        // =========================================

        document
            .getElementById("question")
            .addEventListener(
                "keydown",

                function(event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        askQuestion();
                    }
                }
            );

        // =========================================
        // INITIAL LOAD
        // =========================================

        loadDocuments();

    </script>

</body>

</html>
